<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>warqstress.xyz | Next-Gen Stresser Panel</title>
    <!-- Tailwind CSS ve FontAwesome İkonları -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .cyber-grid { background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body class="cyber-grid min-h-screen flex flex-col justify-between">

    <!-- Üst Menü / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-bolt text-red-500 text-2xl animate-pulse"></i>
            <span class="text-xl font-black tracking-wider text-white">WARQ<span class="text-red-500">STRESS</span></span>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <span class="flex items-center gap-2 bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20">
                <span class="h-2 w-2 rounded-full bg-emerald-500 animate-ping"></span> Network Online
            </span>
        </div>
    </header>

    <!-- Ana Panel İçeriği -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start mt-4">
        
        <!-- Sol Kolon: Test Başlatma Formu -->
        <div class="lg:col-span-2 bg-slate-900/80 border border-slate-800 rounded-xl p-6 shadow-2xl backdrop-blur-sm">
            <h2 class="text-lg font-bold text-white mb-6 flex items-center gap-2 border-b border-slate-800 pb-3">
                <i class="fa-solid fa-terminal text-red-500"></i> Launch Stress Test
            </h2>
            
            <div class="space-y-5">
                <!-- Hedef IP / URL -->
                <div>
                    <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-2">Target IP / URL</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-crosshairs"></i></span>
                        <input type="text" placeholder="127.0.0.1 veya https://example.com" 
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 pl-10 pr-4 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-red-500 transition-colors">
                    </div>
                </div>

                <!-- Port & Süre -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-2">Port</label>
                        <input type="number" placeholder="80" 
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 px-4 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-red-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-2">Time (Seconds)</label>
                        <input type="number" placeholder="60" 
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 px-4 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-red-500 transition-colors">
                    </div>
                </div>

                <!-- Saldırı Metodu -->
                <div>
                    <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-2">Attack Method</label>
                    <select class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 px-4 text-slate-200 focus:outline-none focus:border-red-500 transition-colors cursor-pointer">
                        <option class="text-slate-400">-- Layer 4 (Network) --</option>
                        <option>DNS-AMP (Amplification)</option>
                        <option>UDP-RAW</option>
                        <option>TCP-SYN Flood</option>
                        <option class="text-slate-400">-- Layer 7 (Application) --</option>
                        <option selected>HTTP-BYPASS (Cloudflare/Brave Shield)</option>
                        <option>HTTP-FLOOD</option>
                        <option>TLS-STRIKE</option>
                    </select>
                </div>

                <!-- Gönder Butonu -->
                <button type="button" class="w-full bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-bold py-4 rounded-lg shadow-lg shadow-red-900/20 transition-all flex items-center justify-center gap-2 mt-4 uppercase tracking-wider text-sm">
                    <i class="fa-solid fa-play"></i> Start Flood
                </button>
            </div>
        </div>

        <!-- Sağ Kolon: Ağ İstatistikleri & Sunucu Durumu -->
        <div class="space-y-6">
            <!-- İstatistik Kartı -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-5 shadow-2xl backdrop-blur-sm">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-chart-simple text-amber-500"></i> Network Capacity
                </h3>
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-400">Total Power Capacity</span>
                            <span class="text-amber-400 font-bold">1.2 Tbps</span>
                        </div>
                        <div class="w-full bg-slate-950 rounded-full h-1.5 border border-slate-800">
                            <div class="bg-amber-500 h-1.5 rounded-full" style="width: 85%"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-400">Concurrent Slots</span>
                            <span class="text-red-400 font-bold">0 / 15 Active</span>
                        </div>
                        <div class="w-full bg-slate-950 rounded-full h-1.5 border border-slate-800">
                            <div class="bg-red-500 h-1.5 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bilgi / İletişim Kartı -->
            <div class="bg-gradient-to-b from-slate-900/90 to-slate-950 border border-slate-800 rounded-xl p-5 shadow-2xl backdrop-blur-sm relative overflow-hidden group">
                <div class="absolute -right-8 -bottom-8 text-slate-800/10 text-8xl pointer-events-none group-hover:scale-110 transition-transform duration-500">
                    <i class="fa-brands fa-telegram"></i>
                </div>
                <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-user-shield text-blue-400"></i> Administration
                </h3>
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between items-center bg-slate-950/50 p-2.5 rounded-lg border border-slate-800/60">
                        <span class="text-slate-400"><i class="fa-solid fa-crown text-amber-400 mr-2"></i>Owner:</span>
                        <span class="font-mono text-white font-bold tracking-wide">anix</span>
                    </div>
                    <a href="https://t.me" target="_blank" class="flex justify-between items-center bg-blue-500/5 hover:bg-blue-500/10 p-2.5 rounded-lg border border-blue-500/20 transition-all group/link">
                        <span class="text-slate-400"><i class="fa-brands fa-telegram text-blue-400 mr-2"></i>Telegram:</span>
                        <span class="font-mono text-blue-400 font-bold group-hover/link:underline">@l7run</span>
                    </a>
                </div>
            </div>
        </div>

    </main>

    <!-- Alt Bilgi (Footer) -->
    <footer class="w-full border-t border-slate-900 bg-slate-950/80 p-4 text-center text-xs text-slate-600">
        <p>warqstress.xyz © 2026 | Powered by Cloudflare Workers & Pages</p>
    </footer>

</body>
</html>
