<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARQ STRESS - Dashboard</title>
    <style>
        :root {
            --bg-color: #060407; 
            --panel-bg: #0c0810; 
            --card-bg: #110c17;
            --accent-purple: #a855f7; 
            --accent-red: #ff2a5f; 
            --text-muted: #857591;
            --border-color: #20142b;
            --input-bg: #170f21;
        }

        body {
            background-color: var(--bg-color);
            color: #f1ecf5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; min-height: 100vh;
        }

        /* Şifreli Giriş Ekranı */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box {
            background: var(--panel-bg); border: 1px solid var(--border-color); padding: 40px; border-radius: 12px; text-align: center; width: 100%; max-width: 380px;
        }

        /* SOL DİKEY MENÜ (Görseldeki Gibi) */
        .sidebar {
            width: 70px; background: #09050c; border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 25px;
        }
        .sidebar-logo {
            font-weight: 900; color: var(--accent-red); font-size: 1.2rem; margin-bottom: 20px;
        }
        .sidebar-icon {
            color: var(--text-muted); font-size: 1.3rem; cursor: pointer; transition: 0.3s;
        }
        .sidebar-icon.active, .sidebar-icon:hover { color: var(--accent-purple); }

        /* ANA İÇERİK ALANI */
        .wrapper {
            flex: 1; display: flex; flex-direction: column; background: #0a060f;
        }

        /* Üst Bar ve Sayaç Alanı */
        .topbar {
            height: 60px; border-bottom: 1px solid var(--border-color); display: flex;
            justify-content: space-between; align-items: center; padding: 0 30px;
        }
        .topbar-left { font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px; }
        .active-counter {
            background: rgba(168, 85, 247, 0.1); border: 1px solid var(--accent-purple);
            padding: 4px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; letter-spacing: 1px;
        }
        /* Panel Düzeni (İki Bölmeli Grid Düzeni) */
        .dashboard-grid {
            display: grid; grid-template-columns: 1fr 1.2fr; gap: 25px; padding: 30px; box-sizing: border-box; flex-grow: 1;
        }

        .pane-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 25px; display: flex; flex-direction: column;
        }

        .pane-title {
            font-size: 0.95rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px; color: #fff;
        }

        /* Layer Butonları Geçişleri */
        .layer-switch-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;
        }
        .layer-btn {
            background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        .layer-btn.active {
            background: rgba(168, 85, 247, 0.15); border-color: var(--accent-purple); color: #fff;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
        
        input, select {
            width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 6px; color: #fff; box-sizing: border-box; font-weight: 600;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent-purple); }

        .start-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none; border-radius: 6px; color: white; font-weight: 800; font-size: 1rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; margin-top: auto;
        }
        .start-btn:hover { box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }

        .layer-form { display: none; }
        .layer-form.active { display: block; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; text-align: left; }
        th { color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        td { font-weight: 600; }
        
        .no-data { text-align: center; color: var(--text-muted); padding: 50px 0; font-style: italic; }
        .badge-running { color: #33ff99; font-weight: 700; }
        .badge-time { background: rgba(255, 42, 95, 0.15); color: var(--accent-red); padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(255,42,95,0.2); }
    </style>
</head>
<body>

    <!-- ŞİFRE DOĞRULAMA -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: var(--accent-red); margin: 0 0 10px 0; font-weight: 900; letter-spacing: 1px;">WARQ LOGIN</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px;">Enter credential security code</p>
            <input type="password" id="panel-password" placeholder="••••••••" style="text-align: center; margin-bottom: 20px;">
            <button class="start-btn" onclick="checkPassword()">AUTHORIZE</button>
            <p id="login-error" style="color: var(--accent-red); margin-top: 15px; display: none; font-size: 0.85rem; font-weight: 700;">❌ INVALID SECURITY KEY</p>
        </div>
    </div>

    <!-- DİKEY SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-logo">W</div>
        <div class="sidebar-icon active">💻</div>
        <div class="sidebar-icon" onclick="window.location.href='/'">🏠</div>
    </div>

    <!-- SAĞ WRAPPER -->
    <div class="wrapper">
        <div class="topbar">
            <div class="topbar-left">Stress Panel</div>
            <div class="active-counter">ACTIVE: <span id="global-active-count">0</span></div>
        </div>

        <div class="dashboard-grid">
            <!-- AYARLAR PANELİ -->
            <div class="pane-card">
                <div class="layer-switch-row">
                    <button class="layer-btn active" id="btn-tab-l7" onclick="toggleLayer('l7')">Layer 7</button>
                    <button class="layer-btn" id="btn-tab-l4" onclick="toggleLayer('l4')">Layer 4</button>
                </div>

                <!-- L7 FORMU -->
                <div id="form-l7" class="layer-form active">
                    <div class="pane-title">Target URL Configuration</div>
                    <div class="form-group">
                        <label>Target Hostname</label>
                        <input type="text" id="l7-host" placeholder="https://example.com" value="https://domain.com">
                    </div>
                    <div class="form-group">
                        <label>Attack Vector Method</label>
                        <select id="l7-method">
                            <option value="WARQ MAX">WARQ MAX</option>
                            <option value="WARQ-BROWSER">WARQ-BROWSER</option>
                            <option value="HTTP BYPASS">HTTP BYPASS</option>
                            <option value="HTTPS BYPASS">HTTPS BYPASS</option>
                            <option value="AKAMAI BYPASS">AKAMAI BYPASS</option>
                            <option value="CLOUDFLARE BYPASS">CLOUDFLARE BYPASS</option>
                            <option value="CF-UAM BYPASS">CF-UAM BYPASS</option>
                            <option value="AWS BYPASS">AWS BYPASS</option>
                            <option value="TLS BYPASS">TLS BYPASS</option>
                            <option value="FASTLY BYPASS">FASTLY BYPASS</option>
                            <option value="WARQ-GET">WARQ-GET</option>
                            <option value="WARQ-POST">WARQ-POST</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Execution Time (Max 3600s)</label>
                        <input type="number" id="l7-time" value="150" min="10" max="3600">
                    </div>
                    <button class="start-btn" onclick="triggerAttack('l7')">► START ATTACK</button>
                </div>

                <!-- L4 FORMU -->
                <div id="form-l4" class="layer-form">
                    <div class="pane-title">Infrastructure IP Configuration</div>
                    <div class="form-group">
                        <label>Target IP address</label>
                        <input type="text" id="l4-ip" placeholder="192.168.1.1" value="1.1.1.1">
                    </div>
                    <div class="form-group">
                        <label>Port Target</label>
                        <input type="text" id="l4-port" value="80">
                    </div>
                    <div class="form-group">
                        <label>Network Protocol Method</label>
                        <select id="l4-method">
                            <option value="UDP-POWER">UDP-POWER | UDP POWER (Powerful)</option>
                            <option value="UDP-ENET">UDP-ENET | UDP flood with ENet protocol</option>
                            <option value="UDP-PPS">UDP-PPS | UDP flood with random packets</option>
                            <option value="TCP-BGP">TCP-BGP | BGP (TCP flood with BGP protocol)</option>
                            <option value="TCP-SYN">TCP-SYN | SYN (TCP SYN, high PPS)</option>
                            <option value="TCP-LDAP">TCP-LDAP | LDAP (TCP flood with LDAP protocol)</option>
                            <option value="TCP-MYSQL">TCP-MYSQL | MySQL (TCP flood with MySQL protocol)</option>
                            <option value="TCP-IRC">TCP-IRC | IRC (TCP flood with IRC protocol)</option>
                            <option value="DISCORD">DISCORD | (Bypass Discord Call)</option>
                            <option value="AMPLIFICATION">AMPLIFICATION | (AMP)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Execution Time</label>
                        <input type="number" id="l4-time" value="150" min="10" max="3600">
                    </div>
                    <button class="start-btn" onclick="triggerAttack('l4')">► START ATTACK</button>
                </div>
            </div>
            <!-- CANLI OPERASYONLAR TABLOSU -->
            <div class="pane-card">
                <div class="pane-title">⚡ RUNNING ATTACKS OPERATIONS</div>
                <div style="flex-grow: 1; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Target / Endpoint</th>
                                <th>Method</th>
                                <th>Time Left</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="live-attack-tbody">
                            <tr id="empty-row-msg">
                                <td colspan="4" class="no-data">NO ACTIVE OPERATIONS RUNNING</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let runningCount = 0;

        // Şifre kontrolü
        function checkPassword() {
            if (document.getElementById('panel-password').value === "anixwarq123") {
                document.getElementById('login-screen').style.display = 'none';
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        // Katmanlar (L4/L7) arası geçiş yönetimi
        function toggleLayer(type) {
            document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.layer-form').forEach(f => f.classList.remove('active'));
            if(type === 'l7') {
                document.getElementById('btn-tab-l7').classList.add('active');
                document.getElementById('form-l7').classList.add('active');
            } else {
                document.getElementById('btn-tab-l4').classList.add('active');
                document.getElementById('form-l4').classList.add('active');
            }
        }

        // Saldırıyı başlatan ana fonksiyon
        function triggerAttack(layer) {
            let target = "", method = "", time = 0;

            if(layer === 'l7') {
                target = document.getElementById('l7-host').value.trim();
                method = document.getElementById('l7-method').value;
                time = parseInt(document.getElementById('l7-time').value);
                if(!target || target === "https://domain.com") { alert("Geçerli bir URL giriniz!"); return; }
            } else {
                let ip = document.getElementById('l4-ip').value.trim();
                let port = document.getElementById('l4-port').value.trim();
                target = ip + ":" + port;
                method = document.getElementById('l4-method').value;
                time = parseInt(document.getElementById('l4-time').value);
                if(!ip || !port) { alert("IP ve Port bilgilerini eksiksiz giriniz!"); return; }
            }

            if(isNaN(time) || time <= 0) { alert("Geçerli bir süre giriniz!"); return; }

            // Cloudflare Pages Functions (Workers Köprüsü) İsteği
            fetch('/attack', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ layer, target, method, time })
            }).catch(e => console.log("Bridge veya Worker bağlantısı kurulamadı."));

            // Eğer ilk saldırı ise 'No Active Operations' yazısını tablodan kaldırır
            const emptyMsg = document.getElementById('empty-row-msg');
            if(emptyMsg) emptyMsg.remove();

            // Üst barda duran genel AKTİF sayaç miktarını arttırır
            runningCount++;
            document.getElementById('global-active-count').innerText = runningCount;

            const tbody = document.getElementById('live-attack-tbody');
            const rowId = 'row-' + Date.now();
            const badgeId = 'badge-' + Date.now();

            // Tabloya yeni operasyon satırını ekler
            const tr = document.createElement('tr');
            tr.id = rowId;
            tr.innerHTML = `
                <td style="color:#fff; font-family:monospace; word-break:break-all;">${target}</td>
                <td style="color:var(--accent-purple); font-weight:bold;">${method}</td>
                <td><span class="badge-time" id="${badgeId}">${time}s</span></td>
                <td class="badge-running">Running</td>
            `;
            tbody.insertBefore(tr, tbody.firstChild);

            // Geri sayım döngüsü ve süre bitiminde tablodan kaldırma işlemi
            const loop = setInterval(() => {
                time--;
                const badge = document.getElementById(badgeId);
                if(badge) badge.innerText = time + 's';

                if(time <= 0) {
                    clearInterval(loop);
                    
                    // Süresi biten saldırı satırını tablodan tamamen siler
                    const targetRow = document.getElementById(rowId);
                    if(targetRow) targetRow.remove();

                    // Genel aktif sayaç sayısını bir azaltır
                    runningCount--;
                    if(runningCount < 0) runningCount = 0;
                    document.getElementById('global-active-count').innerText = runningCount;

                    // Eğer çalışan hiçbir aktif operasyon kalmadıysa bilgi yazısını geri getirir
                    if(runningCount === 0) {
                        tbody.innerHTML = `
                            <tr id="empty-row-msg">
                                <td colspan="4" class="no-data">NO ACTIVE OPERATIONS RUNNING</td>
                            </tr>
                        `;
                    }
                }
            }, 1000);
        }
    </script>
</body>
</html>
